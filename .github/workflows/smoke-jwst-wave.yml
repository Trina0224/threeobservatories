name: Numerical and rendering checks

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'src/main.js'
      - 'src/roman-mission.js'
      - 'src/roman-heliocentric.js'
      - 'src/roman-entry.js'
      - 'src/ui/**'
      - 'src/physics/**'
      - 'src/data/**'
      - 'src/three-add-guard.js'
      - 'public/data/jwst-horizons.json'
      - 'scripts/smoke-jwst-wave.mjs'
      - 'scripts/check-roman-transfer.mjs'
      - 'scripts/check-roman-halo.mjs'
      - 'scripts/check-roman-track.mjs'
      - 'public/data/roman-horizons.json'
      - 'src/missions/**'
      - 'src/render/**'
      - '.github/workflows/smoke-jwst-wave.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser test dependencies
        run: npm install --no-save playwright-core@1.55.0 pngjs@7.0.0

      - name: Check the Roman L2 halo
        run: node scripts/check-roman-halo.mjs

      - name: Check the Roman transfer physics
        run: node scripts/check-roman-transfer.mjs

      - name: Check Roman's measured track and its continuation
        run: node scripts/check-roman-track.mjs

      - name: Start local site
        run: |
          python3 -m http.server 4173 > /tmp/threeobservatories-http.log 2>&1 &
          echo $! > /tmp/threeobservatories-http.pid
          sleep 2

      - name: Verify local L2 wave
        env:
          SMOKE_OUTPUT_PREFIX: jwst-wave-local
        run: node scripts/smoke-jwst-wave.mjs

      - name: Wait for GitHub Pages deployment
        run: sleep 90

      - name: Verify published L2 wave
        env:
          SMOKE_URL: https://trina0224.github.io/threeobservatories/?build=${{ github.sha }}
          SMOKE_OUTPUT_PREFIX: jwst-wave-live
        run: node scripts/smoke-jwst-wave.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jwst-wave-smoke
          path: artifacts/*.png
          if-no-files-found: warn
